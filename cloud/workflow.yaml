# Runs an agent for every file that lands in the listings bucket.
# Eventarc starts this workflow with the Cloud Storage event. The agents run in the Cloud Run
# service at SERVICE_URL, which sees the bucket under MOUNT_PATH. cloud/deploy.sh sets both.
main:
  params: [event]
  steps:
    - init:
        assign:
          - service_url: ${sys.get_env("SERVICE_URL")}
          - object_name: ${event.data.name}
          - file_path: ${sys.get_env("MOUNT_PATH") + "/" + object_name}
          - session_id: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}
          - lower_name: ${text.to_lower(object_name)}
    - choose_agent:
        switch:
          - condition: ${text.match_regex(lower_name, "\\.(jpe?g|png)$")}
            assign:
              - app: listing_agent
              - state:
                  photo_path: ${file_path}
              - message: Create the listing draft for the photo.
            next: create_session
          - condition: ${text.match_regex(lower_name, "\\.md$")}
            assign:
              - app: publisher_agent
              - state:
                  draft_path: ${file_path}
              - message: Prepare the listing for posting.
            next: create_session
    - ignore:
        return:
          file: ${object_name}
          agent: none
    - create_session:
        call: http.post
        args:
          url: ${service_url + "/apps/" + app + "/users/eventarc/sessions/" + session_id}
          auth:
            type: OIDC
            audience: ${service_url}
          body:
            state: ${state}
    - run_agent:
        call: http.post
        args:
          url: ${service_url + "/run"}
          auth:
            type: OIDC
            audience: ${service_url}
          timeout: 900
          body:
            appName: ${app}
            userId: eventarc
            sessionId: ${session_id}
            newMessage:
              role: user
              parts:
                - text: ${message}
        result: run
    - check_last_event:
        assign:
          - last_event: ${run.body[len(run.body) - 1]}
        next: check_error
    - check_error:
        switch:
          - condition: ${map.get(last_event, "errorCode") != null}
            raise:
              file: ${object_name}
              agent: ${app}
              error: ${last_event.errorCode}
              message: ${map.get(last_event, "errorMessage")}
    - collect_answer:
        assign:
          - answer: ''
          - parts: ${default(map.get(last_event, ["content", "parts"]), [])}
    - join_text_parts:
        for:
          value: part
          in: ${parts}
          steps:
            - add_text:
                assign:
                  - answer: ${answer + default(map.get(part, "text"), "")}
    - report:
        return:
          file: ${object_name}
          agent: ${app}
          answer: ${answer}
