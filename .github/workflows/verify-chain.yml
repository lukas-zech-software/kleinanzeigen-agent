name: Verify chain

on:
  push:
    branches:
      - main
      - 'chapter-**'
  schedule:
    # Mondays, 05:17 UTC: catches breakage from upstream dependencies.
    - cron: '17 5 * * 1'
  workflow_dispatch:

concurrency:
  group: verify-chain-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-chain:
    # Forks often copy only main, and the chain needs every chapter branch.
    if: github.repository == 'lukas-zech-software/kleinanzeigen-agent'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create local branches for the chain
        run: |
          git for-each-ref --format='%(refname:lstrip=3)' \
            refs/remotes/origin/main 'refs/remotes/origin/chapter-*' |
            while read -r branch; do
              git update-ref "refs/heads/$branch" "refs/remotes/origin/$branch"
            done
          git branch --list

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Verify the chapter chain
        run: scripts/verify-chain.sh
